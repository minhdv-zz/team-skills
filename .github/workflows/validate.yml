name: Validate contributions

on:
  pull_request:
    paths:
      - "plugins/**"
      - "scripts/**"
      - "docs/**"
      - ".claude-plugin/**"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate skills
        run: python scripts/validate.py
